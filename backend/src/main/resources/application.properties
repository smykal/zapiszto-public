server.address=0.0.0.0
server.port=8080

# Database
spring.datasource.url=xxxxxxxxxxxxxxxxxxxxxx
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= validate

#liquibase
liquibase.setClearCheckSums=true
spring.liquibase.clear-check-sums=false


# App Properties
zapiszTo.app.jwtSecret=${JWT_SECRET}
zapiszTo.app.jwtExpirationMs= 1209600000

# Encryption properties
encryption.key=${ENCRYPTION_KEY}
encryption.initVector=${ENCRYPTION_INITVECTOR}
encryption.algo=xxxxxxxxxxxxxxxxxxxxxx

# MAIL
spring.mail.host=xxxxxxxxxxxxxxxxxxxxxx
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Facebook OAuth2 ---
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
app.oauth2.frontend-redirect-uri=xxxxxxxxxxxxxxxxxxxxxx
app.oauth2.android-redirect-uri=xxxxxxxxxxxxxxxxxxxxxx

# AWS
aws.s3.region=xxxxxxxxxxxxxxxxxxxxxx
aws.s3.bucket-body-photos=xxxxxxxxxxxxxxxxxxxxxx
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}

# AWS ClaudFront
cloudfront.domain=xxxxxxxxxxxxxxxxxxxxxx
cloudfront.key-pair-id=xxxxxxxxxxxxxxxxxxxxxx
cloudfront.private-key.path=xxxxxxxxxxxxxxxxxxxxxx
cloudfront.url-validity-minutes=5

# Attachments
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB


